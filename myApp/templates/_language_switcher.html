{% if show_language_switcher %}
<div class="language-switcher mb-4 flex flex-wrap items-center gap-2">
    <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">
        <i class="fas fa-language mr-1"></i> Language
    </span>
    {% for lang in enabled_languages %}
    <a href="?lang={{ lang }}"
       class="px-3 py-1 rounded-full text-xs font-semibold border transition-all
       {% if lang == active_language %}bg-cyan-electric/20 border-cyan-electric/50 text-cyan-electric{% else %}border-white/20 text-gray-300 hover:border-cyan-electric/30 hover:text-cyan-electric{% endif %}">
        {% if lang == 'en' %}English{% elif lang == 'it' %}Italian{% elif lang == 'fil' %}Filipino{% elif lang == 'es' %}Spanish{% else %}{{ lang|upper }}{% endif %}
    </a>
    {% endfor %}
</div>
{% endif %}
